# Closet Dash auto-start. Installed to /etc/upstart/ by KUAL > Closet Dash > Enable auto-start;
# removed by Disable auto-start. Does nothing unless extensions/closetdash/AUTOSTART exists.
description "Closet Dash auto-start (weather display)"

start on started framework

task

script
	[ -f /mnt/us/extensions/closetdash/bin/boot.sh ] || exit 0
	/bin/sh /mnt/us/extensions/closetdash/bin/boot.sh < /dev/null > /dev/null 2>&1 &
end script
